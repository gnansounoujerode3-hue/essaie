[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortsforge"
version = "1.0.0"
description = "Pipeline de production de Shorts marketing verticaux (9:16) : hook, montage, sous-titres dynamiques, audio, score de performance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
sf = "shortsforge.cli:main"
shortsforge = "shortsforge.cli:main"

[tool.setuptools]
packages = ["shortsforge"]
include-package-data = true

[tool.setuptools.package-data]
shortsforge = [
    "py.typed",
    "studio/*.html",
    "studio/*.css",
    "studio/*.js",
    "skill_library/manifest.json",
    "skill_library/*/SKILL.md",
    "bundled_assets/fonts/*.ttf",
    "bundled_assets/music/*.mp3",
    "bundled_assets/sfx/*.mp3",
]
