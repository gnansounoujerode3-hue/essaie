  - {text: "Trois erreurs qui tuent tes vues.", start: 0.000, duration: 1.591, size: 66, max_width: 800, y: 0.70}
  - {text: "Un : tu commences par te présenter.", start: 1.491, duration: 2.371, size: 64, max_width: 800, y: 0.70}
  - {text: "Personne ne te connaît.", start: 3.862, duration: 2.156, size: 64, max_width: 800, y: 0.70}
  - {text: "Deux : tu laisses des plans morts de trois secondes.", start: 6.018, duration: 2.691, size: 64, max_width: 800, y: 0.70}
  - {text: "Zéro rétention.", start: 8.710, duration: 1.558, size: 66, max_width: 800, y: 0.70}
  - {text: "Trois : pas de sous-titres.", start: 10.268, duration: 2.136, size: 64, max_width: 800, y: 0.70}
  - {text: "Soixante-dix pour cent regardent sans son.", start: 12.404, duration: 2.467, size: 64, max_width: 800, y: 0.70}
  - {text: "Alors : hook fort, coupe toutes les deux secondes.", start: 14.871, duration: 3.094, size: 64, max_width: 800, y: 0.70}
  - {text: "Sous-titres en gros.", start: 17.965, duration: 1.331, size: 64, max_width: 800, y: 0.70}
  - {text: "Et boucle la fin sur le début.", start: 19.296, duration: 1.504, size: 64, max_width: 800, y: 0.70}
  - {text: "Tu gagnes des minutes de visionnage.", start: 20.800, duration: 2.281, size: 64, max_width: 800, y: 0.70}
  - {text: "Je donne une astuce par jour.", start: 23.081, duration: 1.563, size: 64, max_width: 800, y: 0.70}
  - {text: "Le conseil numéro deux arrive demain.", start: 24.645, duration: 1.478, size: 64, max_width: 800, y: 0.70}

