# ShortsForge — Short de démonstration
# « 3 erreurs qui tuent tes vues » — format vertical 9:16, 28 s
title: "3 erreurs qui tuent tes vues"
slug: "3_erreurs_qui_tuent_tes_vues"
grade: "standard"

brand:
  name: "ShortsForge Studio"
  primary: "#FF2E63"
  accent: "#25F4EE"
  ink: "#FFFFFF"
  paper: "#0B0B0F"
  font_title: "anton"
  font_caption: "inter-800"
  font_sticker: "inter-900"

duration: 28.0
width: 1080
height: 1920
fps: 30
loop: true

hook:
  text: "3 ERREURS QUI TUENT TES VUES"
  subtext: "La 3ᵉ est invisible"
  badge: "À VOIR"
  duration: 2.8

# ---------------------------------------------------------------- plans ----
shots:
  - id: h1
    duration: 2.8
    source: assets/media/creator_studio.jpg
    motion: {kind: kenburns-in, start_scale: 1.02, end_scale: 1.16}
    transition: flash

  - id: e1
    duration: 2.6
    source: assets/media/phone_closeup.jpg
    motion: {kind: kenburns-in, start_scale: 1.0, end_scale: 1.12}
    transition: whip
    texts:
      - {text: "ERREUR 1", position: upper, size: 96, effect: pop, duration: 2.6, color: "#FF2E63"}
      - {text: "Tu commences par te présenter", position: center, size: 62, effect: fade, duration: 2.4, at: 0.2}

  - id: e1b
    duration: 2.4
    source: assets/media/creator_studio.jpg
    motion: {kind: kenburns-out, start_scale: 1.14, end_scale: 1.0}
    transition: cut
    stickers:
      - {text: "personne te connaît", position: top-right, at: 0.2, duration: 2.0, scale: 0.9, rotation: -6}

  - id: e2
    duration: 2.6
    source: assets/media/editing_timeline.jpg
    motion: {kind: pan-left, start_scale: 1.1, end_scale: 1.1}
    transition: whip
    texts:
      - {text: "ERREUR 2", position: upper, size: 96, effect: pop, duration: 2.6, color: "#FF2E63"}
      - {text: "Des plans morts de 3 secondes", position: center, size: 62, effect: fade, duration: 2.4, at: 0.2}

  - id: e2b
    duration: 2.2
    source: assets/media/phone_closeup.jpg
    motion: {kind: shake, start_scale: 1.02, end_scale: 1.1}
    transition: cut
    texts:
      - {text: "3 s = 0 rétention", position: center, size: 76, effect: shake, duration: 2.2, highlights: ["0"]}

  - id: e3
    duration: 2.6
    source: assets/media/phone_closeup.jpg
    motion: {kind: kenburns-in, start_scale: 1.0, end_scale: 1.14}
    transition: glitch
    texts:
      - {text: "ERREUR 3", position: upper, size: 96, effect: pop, duration: 2.6, color: "#FF2E63"}
      - {text: "Pas de sous-titres", position: center, size: 62, effect: fade, duration: 2.4, at: 0.2}
    broll:
      - {source: assets/media/creator_studio.jpg, position: bottom-right, width: 300, at: 0.4, duration: 2.0, radius: 24, border: true}

  - id: s1
    duration: 2.8
    source: assets/media/creator_studio.jpg
    motion: {kind: kenburns-out, start_scale: 1.16, end_scale: 1.0}
    transition: flash
    texts:
      - {text: "SOUS-TITRES EN GROS", position: upper, size: 84, effect: pop, duration: 2.8, color: "#25F4EE"}
    stickers:
      - {text: "70 % regardent sans son", position: bottom-left, at: 0.3, duration: 2.3, scale: 0.85}

  - id: s2
    duration: 2.6
    source: assets/media/editing_timeline.jpg
    motion: {kind: shake, start_scale: 1.0, end_scale: 1.1}
    transition: whip
    texts:
      - {text: "COUPE TOUTES LES 2 SECONDES", position: upper, size: 68, effect: pop, duration: 2.6, color: "#25F4EE"}
    stickers:
      - {text: "1,5 - 3 s", position: top-right, at: 0.3, duration: 2.0, scale: 1.0}

  - id: s3
    duration: 2.6
    source: assets/media/creator_studio.jpg
    motion: {kind: kenburns-in, start_scale: 1.0, end_scale: 1.12}
    transition: cut
    texts:
      - {text: "BOUCLE LA FIN SUR LE DÉBUT", position: upper, size: 66, effect: pop, duration: 2.6, color: "#25F4EE"}

  - id: cta
    duration: 2.4
    source: assets/media/editing_timeline.jpg
    motion: {kind: kenburns-in, start_scale: 1.0, end_scale: 1.1}
    transition: flash

  # Plan jumeau du hook : même source, même échelle au dernier frame et reprise du titre.
  - id: twin
    duration: 2.4
    source: assets/media/creator_studio.jpg
    motion: {kind: kenburns-out, start_scale: 1.16, end_scale: 1.02}
    transition: cut
    texts:
      - {text: "3 ERREURS QUI TUENT TES VUES", position: upper, size: 112, effect: pop, duration: 2.4}
      - {text: "La 3ᵉ est invisible", position: center, size: 62, font: inter-800, effect: fade, duration: 2.2, at: 0.2}
    stickers:
      - {text: "À VOIR", position: top-right, at: 0.05, duration: 2.3, scale: 1.0}
      - {text: "le conseil 2 arrive demain", position: bottom-left, at: 0.4, duration: 1.5, scale: 0.85}

