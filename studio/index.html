<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio VESK — Bibliothèque vidéo</title>
<style>
  :root{
    --bg:#0c1015; --panel:#11171f; --panel2:#18212c; --hover:#1c2633;
    --line:#263140; --txt:#edf2f8; --dim:#8e9bad; --muted:#667487;
    --acc:#ffd447; --blue:#62a8ff; --ok:#48d597; --warn:#ffad55;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{height:100vh; overflow:hidden; display:flex; flex-direction:column; background:var(--bg); color:var(--txt); font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  button,input,select{font:inherit}
  button{border:1px solid var(--line); border-radius:9px; padding:8px 12px; background:var(--panel2); color:var(--txt); cursor:pointer; transition:background .15s,border-color .15s,color .15s}
  button:hover{background:var(--hover); border-color:#43536a}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  button.primary{background:var(--acc); border-color:var(--acc); color:#17140a; font-weight:750}
  button.primary:hover{background:#ffe073; border-color:#ffe073}
  button:disabled{opacity:.55; cursor:wait}
  .topbar{height:68px; flex:none; display:flex; align-items:center; gap:20px; padding:0 20px; background:var(--panel); border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:center; gap:11px; min-width:230px}
  .logo{width:35px; height:35px; display:grid; place-items:center; border-radius:10px; background:linear-gradient(145deg,#ffe273,#eeb91d); color:#17140a; font-weight:900; box-shadow:0 5px 18px #ffd44720}
  .brand h1{font-size:15px; line-height:1.2; letter-spacing:.2px}
  .brand small{display:block; margin-top:3px; color:var(--dim); font-size:11px}
  .top-actions{margin-left:auto; display:flex; align-items:center; gap:9px; min-width:0}
  .repo{display:flex; align-items:center; gap:7px; max-width:285px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-size:12px; white-space:nowrap}
  .repo b{overflow:hidden; text-overflow:ellipsis; color:var(--txt); font-weight:550}
  .repo i{font-style:normal; color:var(--muted)}
  .status{display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; white-space:nowrap; padding:0 5px}
  .status::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--muted)}
  .status.ok{color:var(--ok)} .status.ok::before{background:var(--ok)}
  .status.warn{color:var(--warn)} .status.warn::before{background:var(--warn)}
  main{flex:1; min-height:0; display:grid; grid-template-columns:326px minmax(0,1fr)}
  aside{min-height:0; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line)}
  .side-head{flex:none; padding:17px 15px 12px}
  .side-title{display:flex; align-items:center; justify-content:space-between; margin:0 2px 12px; font-size:13px; font-weight:700}
  .side-title span{color:var(--dim); font-size:11px; font-weight:500}
  .search{position:relative}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
  .search input{width:100%; height:38px; padding:0 12px 0 35px; border:1px solid var(--line); border-radius:9px; background:#0d131b; color:var(--txt); font-size:13px}
  .search input::placeholder{color:var(--muted)}
  .list{flex:1; min-height:0; overflow-y:auto; padding:0 9px 14px}
  .group{margin-top:12px}
  .group:first-child{margin-top:2px}
  .group-title{display:flex; align-items:center; gap:7px; padding:0 8px 7px; color:var(--dim); font-size:10.5px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase}
  .group-title::before{content:""; width:5px; height:5px; border-radius:50%; background:#56677e}
  .group.final .group-title{color:var(--acc)} .group.final .group-title::before{background:var(--acc)}
  .group-title span{margin-left:auto; color:var(--muted); letter-spacing:0; font-weight:550}
  .vid{display:flex; align-items:center; gap:11px; width:100%; padding:8px; margin-bottom:3px; border:1px solid transparent; border-radius:11px; cursor:pointer; transition:background .12s,border-color .12s}
  .vid:hover{background:var(--panel2)}
  .vid.active{background:#202a36; border-color:#455368}
  .group.final .vid.active{border-color:#8a752d; background:#29291f}
  .thumb{position:relative; flex:none; width:52px; height:72px; overflow:hidden; display:grid; place-items:center; border-radius:7px; background:#05080c; color:#536176}
  .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .thumb svg{width:17px; height:17px}
  .meta{min-width:0; flex:1}
  .nm{color:var(--txt); font-size:12.5px; font-weight:650; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .sub{margin-top:5px; color:var(--dim); font-size:11px; white-space:nowrap}
  .sync-dot{flex:none; align-self:flex-start; width:6px; height:6px; margin:6px 2px 0 0; border-radius:50%; background:var(--ok)}
  .sync-dot.local{background:var(--warn)}
  .empty-list{padding:35px 16px; text-align:center; color:var(--dim); font-size:13px}
  .side-bottom{flex:none; padding:12px 14px 14px; border-top:1px solid var(--line)}
  .drop{padding:12px 10px; border:1px dashed #3a485b; border-radius:10px; text-align:center; color:var(--dim); font-size:12px; cursor:pointer; transition:.15s}
  .drop b{display:block; margin-bottom:3px; color:var(--txt); font-size:12.5px}
  .drop small{font-size:10.5px; color:var(--muted)}
  .drop:hover,.drop.over{border-color:var(--acc); background:#ffd44708}
  .bar{display:none; height:3px; margin-top:10px; overflow:hidden; border-radius:3px; background:var(--panel2)}
  .bar i{display:block; width:0; height:100%; background:var(--acc); transition:width .15s}
  .content{min-width:0; min-height:0; display:flex; flex-direction:column}
  .video-head{flex:none; min-height:88px; display:flex; align-items:center; gap:18px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel)}
  .heading{min-width:0; flex:1}
  .eyebrow{margin-bottom:4px; color:var(--blue); font-size:10px; font-weight:750; letter-spacing:1.2px; text-transform:uppercase}
  .heading h2{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; font-weight:700}
  .meta-line{margin-top:4px; color:var(--dim); font-size:11.5px}
  .video-actions{display:flex; gap:7px; flex:none}
  .video-actions button{font-size:12px; padding:7px 10px}
  .stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:radial-gradient(ellipse at center,#141b24 0,#080b0f 72%)}
  video{display:block; width:auto; height:auto; max-width:100%; max-height:100%; outline:none; box-shadow:0 18px 70px #0009}
  .empty-stage{padding:40px; text-align:center; color:var(--dim)}
  .empty-stage .play-empty{width:58px; height:58px; margin:0 auto 15px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; color:var(--muted)}
  .controlbar{flex:none; min-height:54px; display:flex; align-items:center; gap:16px; padding:10px 20px; border-top:1px solid var(--line); background:var(--panel)}
  .controlbar label{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:12px; white-space:nowrap; cursor:pointer}
  input[type=checkbox]{accent-color:var(--acc)}
  select{padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--txt); font-size:12px}
  .path{margin-left:auto; max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:11px}
  #toasts{position:fixed; right:18px; bottom:18px; z-index:50; display:flex; flex-direction:column; gap:8px}
  .toast{max-width:420px; padding:11px 14px; border:1px solid var(--line); border-left:3px solid var(--acc); border-radius:9px; background:#1a2330; box-shadow:0 8px 30px #0008; font-size:13px}
  .toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:#ff6666}
  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#2b3747; border-radius:6px}
  @media(max-width:1050px){.repo{display:none}.brand{min-width:190px}main{grid-template-columns:292px minmax(0,1fr)}}
  @media(max-width:760px){.status{display:none}.topbar{padding:0 12px}.top-actions{gap:6px}.top-actions button span{display:none}main{grid-template-columns:250px minmax(0,1fr)}.video-actions button{padding:7px;font-size:0}.video-actions button::first-letter{font-size:12px}.path{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">V</div>
    <div><h1>Studio VESK</h1><small>Bibliothèque vidéo du dépôt</small></div>
  </div>
  <div class="top-actions">
    <span class="repo">essaie <i>/</i> <b id="branch">…</b></span>
    <span class="status" id="syncBadge">Connexion…</span>
    <button id="btnSync" type="button" title="Récupérer l’état de GitHub">⟳ <span>Synchroniser</span></button>
    <button id="btnImport" class="primary" type="button">↑ <span>Importer</span></button>
  </div>
</header>
<main>
  <aside>
    <div class="side-head">
      <div class="side-title">Bibliothèque <span id="count">0 vidéo</span></div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Rechercher une vidéo…" autocomplete="off">
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="side-bottom">
      <div class="drop" id="drop" role="button" tabindex="0">
        <b>Déposer une vidéo ici</b>
        <small>ou cliquer pour importer · 100 Mo max</small>
      </div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
    </div>
    <input type="file" id="file" accept="video/*" hidden>
  </aside>
  <section class="content">
    <div class="video-head">
      <div class="heading">
        <div class="eyebrow" id="vGroup">Lecture</div>
        <h2 id="vTitle">Sélectionnez une vidéo</h2>
        <div class="meta-line" id="vMeta">La vidéo finale est affichée en premier.</div>
      </div>
      <div class="video-actions">
        <button id="btnGh" type="button" hidden>GitHub</button>
        <button id="btnRaw" type="button" hidden>Lien direct</button>
        <button id="btnCopy" type="button" hidden>Copier le lien</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="empty-stage" id="empty">
        <div class="play-empty">▶</div>
        Choisissez une vidéo dans la bibliothèque.
      </div>
      <video id="player" controls playsinline hidden></video>
    </div>
    <div class="controlbar">
      <label><input type="checkbox" id="loop"> Lecture en boucle</label>
      <label>Vitesse
        <select id="speed">
          <option value="0.5">0,5×</option><option value="1" selected>1×</option>
          <option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option>
        </select>
      </label>
      <span class="path" id="vPath"></span>
    </div>
  </section>
</main>
<div id="toasts"></div>
<script>
const $ = (id) => document.getElementById(id);
const player = $("player");
let videos = [], current = null;

const GROUPS = [
  ["final", "Vidéo finale"], ["imports", "Imports"], ["references", "Références"],
  ["captures", "Enregistrements d’écran"], ["source", "Source originale"], ["other", "Autres vidéos"]
];
function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function norm(value) {
  return String(value).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function category(v) {
  if (v.path.startsWith("imports/")) return "imports";
  if (v.name === "rush_marketing.mp4") return "final";
  if (/^reference/i.test(v.name)) return "references";
  if (/^enregistrement/i.test(v.name)) return "captures";
  if (/^AQN/i.test(v.name)) return "source";
  return "other";
}
function title(v) {
  const cat = category(v);
  if (cat === "final") return "Marketing — version finale";
  if (cat === "source") return "Vidéo source originale";
  let m = v.name.match(/^reference\s*(?:\((\d+)\)|(\d+))/i);
  if (m) return `Référence ${m[1] || m[2]}`;
  m = v.name.match(/(\d{2})(\d{2})(\d{2})\.mp4$/);
  if (cat === "captures" && m) return `Capture écran · ${m[1]}:${m[2]}:${m[3]}`;
  return v.name.replace(/\.[^.]+$/, "");
}
function groupName(v) {
  return (GROUPS.find(([id]) => id === category(v)) || GROUPS.at(-1))[1];
}
function fmtSize(n) {
  let out;
  if (n >= 1073741824) out = (n / 1073741824).toFixed(1) + " Go";
  else if (n >= 1048576) out = (n / 1048576).toFixed(1) + " Mo";
  else out = Math.max(1, Math.round(n / 1024)) + " Ko";
  return out.replace(".", ",");
}
function fmtDur(s) {
  if (s == null) return "Durée inconnue";
  s = Math.round(s);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function toast(msg, cls = "") {
  const el = document.createElement("div");
  el.className = "toast " + cls;
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 5200);
}
async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function loadStatus() {
  try {
    const st = await api("/api/status");
    $("branch").textContent = st.branch;
    $("branch").title = st.branch;
    const b = $("syncBadge");
    if (st.dirty) { b.textContent = "Modifications locales"; b.className = "status warn"; }
    else if (st.in_sync) { b.textContent = "Synchronisé"; b.className = "status ok"; }
    else { b.textContent = "À synchroniser"; b.className = "status warn"; }
  } catch (e) { toast("Statut : " + e.message, "err"); }
}

async function loadVideos(selectPath = null) {
  try {
    const data = await api("/api/videos");
    videos = data.videos;
    renderList();
    if (selectPath) {
      const imported = videos.find((v) => v.path === selectPath);
      if (imported) select(imported, true);
    } else if (current) {
      const refreshed = videos.find((v) => v.path === current.path);
      if (refreshed) select(refreshed);
      else if (videos[0]) select(videos.find((v) => category(v) === "final") || videos[0]);
    } else {
      select(videos.find((v) => category(v) === "final") || videos[0]);
    }
  } catch (e) { toast("Bibliothèque : " + e.message, "err"); }
}

function renderList() {
  const query = norm($("search").value.trim());
  const filtered = videos.filter((v) => !query || norm(`${title(v)} ${v.name} ${v.path}`).includes(query));
  $("count").textContent = `${videos.length} vidéo${videos.length > 1 ? "s" : ""}`;
  const list = $("list");
  list.innerHTML = "";
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-list">Aucune vidéo ne correspond à cette recherche.</div>';
    return;
  }
  for (const [id, label] of GROUPS) {
    const items = filtered.filter((v) => category(v) === id)
      .sort((a, b) => title(a).localeCompare(title(b), "fr", { numeric: true }));
    if (!items.length) continue;
    const section = document.createElement("section");
    section.className = "group " + id;
    section.innerHTML = `<div class="group-title">${esc(label)}<span>${items.length}</span></div>`;
    for (const v of items) {
      const row = document.createElement("div");
      row.className = "vid" + (current && current.path === v.path ? " active" : "");
      row.dataset.path = v.path;
      row.innerHTML = `
        <div class="thumb">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>
          <img src="${esc(v.thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="meta">
          <div class="nm" title="${esc(v.name)}">${esc(title(v))}</div>
          <div class="sub">${fmtDur(v.duration)} · ${fmtSize(v.size)}</div>
        </div>
        <i class="sync-dot ${v.synced ? "" : "local"}" title="${v.synced ? "Sur GitHub" : "Local uniquement"}"></i>`;
      row.onclick = () => select(v);
      section.appendChild(row);
    }
    list.appendChild(section);
  }
}

function select(v, play = false) {
  if (!v) return;
  const changed = !current || current.path !== v.path;
  current = v;
  $("empty").style.display = "none";
  player.hidden = false;
  if (changed) {
    player.src = v.file;
    player.load();
  }
  if (play) player.play().catch(() => {});
  $("vGroup").textContent = groupName(v);
  $("vTitle").textContent = title(v);
  $("vTitle").title = v.name;
  $("vMeta").textContent = `${fmtDur(v.duration)} · ${fmtSize(v.size)} · ${v.synced ? "Synchronisée sur GitHub" : "Locale, non synchronisée"}`;
  $("vPath").textContent = v.path;
  $("vPath").title = v.path;
  for (const id of ["btnGh", "btnRaw", "btnCopy"]) $(id).hidden = false;
  $("btnGh").onclick = () => window.open(v.github, "_blank", "noopener");
  $("btnRaw").onclick = () => window.open(v.raw, "_blank", "noopener");
  $("btnCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(location.origin + v.file); toast("Lien copié.", "ok"); }
    catch { toast("Copie impossible dans ce navigateur.", "err"); }
  };
  document.querySelectorAll(".vid").forEach((el) => el.classList.toggle("active", el.dataset.path === v.path));
}

function upload(file) {
  if (!file) return;
  $("file").value = "";
  const bar = $("bar"), fill = $("barFill");
  bar.style.display = "block"; fill.style.width = "0";
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/import?name=" + encodeURIComponent(file.name));
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) fill.style.width = (100 * e.loaded / e.total) + "%"; };
  xhr.onload = async () => {
    bar.style.display = "none";
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200 || data.error) { toast(data.error || "Import impossible.", "err"); return; }
    toast(`« ${file.name} » importé et poussé sur GitHub${data.commit ? " · " + data.commit : ""}.`, "ok");
    await loadStatus();
    await loadVideos(data.path);
  };
  xhr.onerror = () => { bar.style.display = "none"; toast("Réseau : import impossible.", "err"); };
  xhr.send(file);
}

$("btnImport").onclick = () => $("file").click();
$("drop").onclick = () => $("file").click();
$("drop").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") $("file").click(); };
$("file").onchange = (e) => upload(e.target.files[0]);
const drop = $("drop");
["dragover", "dragenter"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));
$("search").addEventListener("input", renderList);

$("btnSync").onclick = async () => {
  $("btnSync").disabled = true;
  try {
    const st = await api("/api/sync", { method: "POST" });
    toast(st.fetched ? "Synchronisation avec GitHub effectuée." : ("Échec : " + (st.fetch_error || "fetch")), st.fetched ? "ok" : "err");
    await loadStatus(); await loadVideos();
  } catch (e) { toast("Synchronisation : " + e.message, "err"); }
  $("btnSync").disabled = false;
};
$("loop").onchange = (e) => { player.loop = e.target.checked; };
$("speed").onchange = (e) => { player.playbackRate = parseFloat(e.target.value); };
player.addEventListener("error", () => { if (player.src && current) toast("Lecture impossible : " + title(current), "err"); });

loadStatus();
loadVideos();
</script>
</body>
</html>
