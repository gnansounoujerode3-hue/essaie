<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio VESK — vidéos du dépôt GitHub</title>
<style>
  :root{
    --bg:#0d1014; --panel:#151a21; --panel2:#1b222c; --line:#2a3341;
    --txt:#e8edf4; --dim:#8b98a9; --acc:#ffd400; --ok:#3ddc84; --warn:#ff9f43;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden}
  header{display:flex; align-items:center; gap:14px; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap}
  header h1{font-size:17px; font-weight:700; letter-spacing:.2px}
  header h1 span{color:var(--acc)}
  .badge{font-size:12px; padding:3px 9px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); white-space:nowrap}
  .badge b{color:var(--txt); font-weight:600}
  .badge.ok{color:var(--ok); border-color:#1d4933}
  .badge.warnc{color:var(--warn); border-color:#59401f}
  button{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 13px; font-size:13px; cursor:pointer; transition:.15s}
  button:hover{border-color:var(--acc); color:var(--acc)}
  button.primary{background:var(--acc); border-color:var(--acc); color:#111; font-weight:700}
  button.primary:hover{filter:brightness(1.08); color:#111}
  main{flex:1; display:grid; grid-template-columns:340px 1fr; min-height:0}
  aside{background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
  .drop{margin:12px; padding:16px 12px; border:2px dashed var(--line); border-radius:12px; text-align:center; color:var(--dim); cursor:pointer; transition:.15s; position:relative}
  .drop:hover,.drop.over{border-color:var(--acc); color:var(--acc); background:#1c1f14}
  .drop small{display:block; margin-top:4px; font-size:11px}
  .bar{height:4px; background:var(--panel2); border-radius:2px; margin:0 12px 8px; overflow:hidden; display:none}
  .bar i{display:block; height:100%; width:0; background:var(--acc); transition:.15s}
  .list{overflow-y:auto; flex:1; padding:4px 8px 14px}
  .vid{display:flex; gap:10px; padding:8px; border-radius:10px; cursor:pointer; border:1px solid transparent; margin-bottom:4px}
  .vid:hover{background:var(--panel2)}
  .vid.active{background:var(--panel2); border-color:var(--acc)}
  .vid img{width:64px; height:88px; object-fit:cover; border-radius:6px; background:#000; flex:none}
  .vid .ph{display:flex; align-items:center; justify-content:center; font-size:22px}
  .meta{min-width:0; align-self:center}
  .meta .nm{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .meta .sub{color:var(--dim); font-size:11.5px; margin-top:3px}
  .tag{display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:99px; margin-top:5px; border:1px solid var(--line); color:var(--dim)}
  .tag.gh{color:var(--ok); border-color:#1d4933}
  .tag.loc{color:var(--warn); border-color:#59401f}
  .content{display:flex; flex-direction:column; min-width:0; min-height:0}
  .stage{flex:1; background:#000; display:flex; align-items:center; justify-content:center; min-height:0; position:relative}
  video{max-width:100%; max-height:100%; width:auto; height:auto; outline:none}
  .empty{color:#4d5766; text-align:center; padding:40px}
  .empty .big{font-size:44px; margin-bottom:10px}
  .toolbar{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap}
  .toolbar .title{font-weight:700; margin-right:auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .toolbar label{color:var(--dim); font-size:12.5px; display:flex; align-items:center; gap:5px; user-select:none}
  select{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px}
  .details{display:flex; gap:18px; padding:8px 14px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); font-size:12px; flex-wrap:wrap}
  .details b{color:var(--txt); font-weight:600}
  #toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:50}
  .toast{background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--acc); padding:10px 14px; border-radius:8px; max-width:420px; box-shadow:0 6px 24px #0008; animation:.2s ease-out}
  .toast.err{border-left-color:#ff5c5c}
  .toast.ok{border-left-color:var(--ok)}
  @keyframes .3{}
  ::-webkit-scrollbar{width:9px} ::-webkit-scrollbar-thumb{background:#29313d; border-radius:6px}
</style>
</head>
<body>
<header>
  <h1>🎬 Studio <span>VESK</span></h1>
  <span class="badge">repo <b id="repo"></b></span>
  <span class="badge">branche <b id="branch">…</b></span>
  <span class="badge" id="syncBadge">synchro …</span>
  <button id="btnSync" title="git fetch + rafraîchir">⟳ Synchroniser</button>
</header>
<main>
  <aside>
    <div class="drop" id="drop">
      ⬆ Importer une vidéo
      <small>glisser-déposer ou cliquer · pousse sur GitHub (100 Mo max)</small>
      <input type="file" id="file" accept="video/*" hidden>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="content">
    <div class="stage" id="stage">
      <div class="empty" id="empty"><div class="big">🎞️</div>Choisissez une vidéo dans la liste<br>ou importez-en une nouvelle.</div>
      <video id="player" controls playsinline hidden></video>
    </div>
    <div class="toolbar">
      <div class="title" id="vTitle">—</div>
      <label>boucle <input type="checkbox" id="loop"></label>
      <select id="speed" title="vitesse">
        <option value="0.5">0,5×</option><option value="1" selected>1×</option>
        <option value="1.25">1,25×</option><option value="1.5">1,5×</option>
        <option value="2">2×</option>
      </select>
      <button id="btnGh" hidden>ouvrir sur GitHub</button>
      <button id="btnRaw" hidden>lien raw</button>
      <button id="btnCopy" hidden>copier le lien</button>
    </div>
    <div class="details" id="details"></div>
  </section>
</main>
<div id="toasts"></div>
<script>
const $ = (id) => document.getElementById(id);
const player = $("player");
let videos = [], current = null;

function toast(msg, cls = "") {
  const el = document.createElement("div");
  el.className = "toast " + cls;
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 5200);
}
function fmtSize(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " Go";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " Mo";
  return Math.max(1, Math.round(n / 1024)) + " Ko";
}
function fmtDur(s) {
  if (s == null) return "—";
  s = Math.round(s);
  const m = Math.floor(s / 60), r = s % 60;
  return m + ":" + String(r).padStart(2, "0");
}
async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function loadStatus() {
  try {
    const st = await api("/api/status");
    $("branch").textContent = st.branch;
    const b = $("syncBadge");
    if (st.dirty) { b.textContent = "modifications locales"; b.className = "badge warnc"; }
    else if (st.in_sync) { b.textContent = "✓ à jour avec GitHub"; b.className = "badge ok"; }
    else { b.textContent = `local ${st.head} ≠ ${st.origin || "?"}`; b.className = "badge warnc"; }
  } catch (e) { toast("status : " + e.message, "err"); }
}

async function loadVideos(keep = true) {
  try {
    const data = await api("/api/videos");
    videos = data.videos;
    $("repo").textContent = "gnansounoujerode3-hue/essaie";
    render(keep);
  } catch (e) { toast("liste : " + e.message, "err"); }
}

function render(keep = true) {
  const list = $("list");
  list.innerHTML = "";
  if (!videos.length) {
    list.innerHTML = '<div class="empty" style="padding:20px">Aucune vidéo dans le dépôt.</div>';
    return;
  }
  for (const v of videos) {
    const row = document.createElement("div");
    row.className = "vid" + (current && current.path === v.path ? " active" : "");
    row.innerHTML = `
      <img src="${v.thumb}" alt="" loading="lazy"
           onerror="this.classList.add('ph'); this.outerHTML='<div class=\\'vid ph\\' style=\\'width:64px;height:88px\\'>🎥</div>'">
      <div class="meta">
        <div class="nm" title="${v.name}">${v.name}</div>
        <div class="sub">▶ ${fmtDur(v.duration)} · ${fmtSize(v.size)}</div>
        <span class="tag ${v.synced ? "gh" : "loc"}">${v.synced ? "GitHub ✓" : "local"}</span>
      </div>`;
    row.onclick = () => select(v);
    list.appendChild(row);
  }
  if (keep && current) {
    const again = videos.find((v) => v.path === current.path);
    if (again) current = again;
  } else {
    select(videos.find((v) => v.name === "rush_marketing.mp4") || videos[0], false);
    return;
  }
}

function select(v, play = false) {
  if (!v) return;
  current = v;
  $("empty").style.display = "none";
  player.hidden = false;
  const wasPlaying = !player.paused;
  player.src = v.file;
  player.load();
  if (play || wasPlaying) player.play().catch(() => {});
  $("vTitle").textContent = v.name;
  $("btnGh").hidden = $("btnRaw").hidden = $("btnCopy").hidden = false;
  $("btnGh").onclick = () => window.open(v.github, "_blank");
  $("btnRaw").onclick = () => window.open(v.raw, "_blank");
  $("btnCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(location.origin + v.file); toast("lien copié", "ok"); }
    catch { toast("copie impossible", "err"); }
  };
  $("details").innerHTML =
    `<span>chemin <b>${v.path}</b></span>` +
    `<span>taille <b>${fmtSize(v.size)}</b></span>` +
    `<span>durée <b>${fmtDur(v.duration)}</b></span>` +
    `<span>source <b>${v.synced ? "GitHub (poussé)" : "locale (non poussée)"}</b></span>`;
  document.querySelectorAll(".vid").forEach((el) => el.classList.remove("active"));
  const idx = videos.indexOf(v);
  if (idx >= 0 && document.querySelectorAll(".vid")[idx])
    document.querySelectorAll(".vid")[idx].classList.add("active");
}

function upload(file) {
  if (!file) return;
  const bar = $("bar"), fill = $("barFill");
  bar.style.display = "block"; fill.style.width = "0";
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/import?name=" + encodeURIComponent(file.name));
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) fill.style.width = (100 * e.loaded / e.total) + "%"; };
  xhr.onload = () => {
    bar.style.display = "none";
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200 || data.error) { toast(data.error || "import impossible", "err"); return; }
    toast(`« ${file.name} » importé ${data.pushed ? "et poussé sur GitHub" : "déjà à jour"} ${data.commit ? "· " + data.commit : ""}`, "ok");
    loadStatus(); loadVideos(false);
    setTimeout(() => {
      const v = videos.find((x) => x.path === data.path);
      if (v) select(v, true);
    }, 350);
  };
  xhr.onerror = () => { bar.style.display = "none"; toast("réseau : import impossible", "err"); };
  xhr.send(file);
}

$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => upload(e.target.files[0]);
const drop = $("drop");
["dragover", "dragenter"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));

$("btnSync").onclick = async () => {
  $("btnSync").disabled = true; $("btnSync").textContent = "⟳ …";
  try {
    const st = await api("/api/sync", { method: "POST" });
    toast(st.fetched ? "fetch GitHub effectué" : ("fetch : " + (st.fetch_error || "échec")), st.fetched ? "ok" : "err");
    await loadStatus(); await loadVideos();
  } catch (e) { toast("sync : " + e.message, "err"); }
  $("btnSync").disabled = false; $("btnSync").textContent = "⟳ Synchroniser";
};

$("loop").onchange = (e) => { player.loop = e.target.checked; };
$("speed").onchange = (e) => { player.playbackRate = parseFloat(e.target.value); };
player.addEventListener("error", () => { if (player.src) toast("lecture impossible : " + current?.name, "err"); });

loadStatus(); loadVideos(false);
</script>
</body>
</html>
